<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1><mark>signup-page:-</mark></h1>
    <form action="#">
        <fieldset>
            <legend>personal information</legend>
        <label for="name">Name:-</label>
        <input type="name" id="name"placeholder="Enter your full name"required><br><br>
        <label for="number">Mobile No:-</label>
        <input type="number" id="number"placeholder=" Enter your moblie no"required><br><br>
        <label for="email">Email:- </label>
        <input type="email" placeholder="Enter your email"required><br><br>
        <label for="password">password:-</label>
        <input type="password"placeholder="Enter your password"required><br><br>
        <label for="age">Age:-</label>
        <input type="number"placeholder="Enter your age"required><br><br>
        <label for="date of birth">Date of Birth:-</label>
        <input type="date"placeholder="DD/MM/YYYY"required><br><br>
        <label for="gender">Gender:-</label><br>
        <label type="male">Male</label>
        <input type="radio"id="male"name="gender"value="male"><br>
        <label for="female">Female</label>
        <input type="radio"id="female"name="gender"value="female"><br>
        <label for="other">other</label>
        <input type="radio"id="other"name="gender"value="other"><br>
        <label for="hobby"><h2>hobby</h2>:-</label><br>
        <label for="swimming">swimming</label>
        <input type="checkbox"id="swimming"name="hobby"value="swimming"><br>
        <label for="cricket">cricket</label>
        <input type="checkbox"id="cricket"name="hobby"value="cricket"><br>
        <label for="football">football</label>
        <input type="checkbox"id="football"name="hobby"value="football"><br>
        <label for="wwe">wwe</label>
        <input type="checkbox"id="wwe"name="hobby"value="wwe"><br>
        
</fieldset>
    </form>
</body>
</html>
